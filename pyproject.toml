[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotpilot"
version = "0.1.0"
description = "Open-source macOS controller for pen plotters, starting with AxiDraw"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "PlotPilot contributors" }]
dependencies = [
    "pyobjc-framework-cocoa>=11.0 ; sys_platform == 'darwin'",
    "PySide6>=6.7,<7",
]

[project.scripts]
plotpilot = "plotpilot.app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.sdist]
include = ["src/plotpilot", "tests", "docs", "specs", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/plotpilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/plotpilot/resources/icons" = "plotpilot/resources/icons"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
